    <!-- Mathematics -->
    <script>
        // See https://docs.mathjax.org/en/latest/index.html for more details.
        MathJax = {
            startup: { typeset: false },
            tex: {
                packages: {},              // extensions to use
                inlineMath: [              // start/end delimiter pairs for in-line math
                    ['$', '$'],
                    ['\\(', '\\)']
                ],
                displayMath: [             // start/end delimiter pairs for display math
                    ['$$', '$$'],
                    ['\\[', '\\]']
                ],
                processEscapes: false,      // use \$ to produce a literal dollar sign
                processEnvironments: true, // process \begin{xxx}...\end{xxx} outside math mode
                processRefs: true,         // process \ref{...} outside of math mode
                digits: /^(?:[0-9]+(?:\{,\}[0-9]{3})*(?:\.[0-9]*)?|\.[0-9]+)/,    // pattern for recognizing numbers
                tags: 'all',              // or 'ams' or 'all'
                tagSide: 'right',          // side for \tag macros
                tagIndent: '0.8em',        // amount to indent tags
                useLabelIds: true,         // use label name rather than tag for ids
                maxMacros: 10000,          // maximum number of macro substitutions per expression
                maxBuffer: 5 * 1024,       // maximum size for the internal TeX string (5K)
                // baseURL:                   // URL for use with links to tags (when there is a <base> tag in effect)
                // (document.getElementsByTagName('base').length === 0) ? '' : String(document.location).replace(/#.*$/, ''),
                formatError:               // function called when TeX syntax errors occur
                    (jax, err) => jax.formatError(err)
            }
        };
    </script>

    <!-- 右下角悬浮点赞按钮 -->
    <div style="position:fixed;bottom:2rem;right:2rem;z-index:9999;text-align:center;">
      <button id="like-btn" onclick="likePage()" style="width:64px;height:64px;border-radius:50%;border:none;background:#1877F2;color:white;cursor:pointer;box-shadow:0 4px 16px rgba(24,119,242,0.4);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 0.3s ease;">
        <span id="like-icon" style="font-size:1.4rem;line-height:1;">🤍</span>
        <span id="like-count" style="font-size:0.65rem;margin-top:2px;">0</span>
      </button>
      <div style="font-size:0.7rem;color:#666;margin-top:4px;">点赞</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script>
      const counterUrl = 'https://api.counterapi.dev/v1/qliao-homepage/likes/';
      function loadCount() {
        fetch(counterUrl)
          .then(r => r.json())
          .then(d => {
            document.getElementById('like-count').innerText = d.count || d || '0';
          })
          .catch(() => {
            document.getElementById('like-count').innerText = '0';
          });
      }
      loadCount();
      function likePage() {
        fetch(counterUrl + 'up', {method: 'GET'})
          .then(r => r.json())
          .then(d => {
            const newCount = d.count || d || '0';
            document.getElementById('like-count').innerText = newCount;
            document.getElementById('like-icon').innerText = '❤️';
            confetti({
              particleCount: 100,
              spread: 80,
              startVelocity: 35,
              origin: { y: 0.85, x: 0.95 }
            });
          })
          .catch(() => {
            confetti({
              particleCount: 100,
              spread: 80,
              origin: { y: 0.85, x: 0.95 }
            });
          });
      }
    </script>
